[project]
name = "gemini-rpa-agent"
version = "0.1.0"
description = "RPA / workflow-automation failure-diagnosis agent on Google Cloud Agent Builder (ADK) + Gemini 2.5 + an RPA MCP server."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Mukunda Katta" }]
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.0.0",
    "google-cloud-aiplatform[agent_engines]>=1.112.0",
    "mcp>=1.0.0",
    "streamlit>=1.40.0",
    "pandas>=2.2.0",
    "uipath>=2.10.0",
    "uipath-google-adk>=0.0.7",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.urls]
Homepage = "https://github.com/MukundaKatta/gemini-rpa-agent"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gemini_rpa_agent = ["py.typed"]
