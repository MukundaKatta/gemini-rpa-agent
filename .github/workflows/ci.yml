name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile all sources
        run: python -m compileall -q src tests scripts app

      - name: Run unit tests (standard library, no third-party deps)
        # The dependency-free RPA data / response builders and the
        # offline-fallback paths are exercised here without installing the
        # heavy google-adk / mcp / pydantic stack. Tests put src/ on the
        # path themselves, so no editable install is required.
        run: python -m unittest discover -s tests -v
